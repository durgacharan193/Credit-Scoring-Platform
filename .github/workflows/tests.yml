name: Test Suites

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Backend Tests
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm test -- --passWithNoTests

  test-scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Scoring Service Tests
        run: |
          cd scoring-service
          pip install -r requirements.txt
          pytest tests/ -v
