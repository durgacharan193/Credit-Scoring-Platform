name: Build, Scan & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  build-and-push:
    name: Build & Push Docker Images
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/credit-backend:${{ github.sha }} -t $ECR_REGISTRY/credit-backend:latest ./backend
          docker push $ECR_REGISTRY/credit-backend:${{ github.sha }}
          docker push $ECR_REGISTRY/credit-backend:latest

      - name: Build and push scoring-service
        run: |
          docker build -t $ECR_REGISTRY/credit-scoring:${{ github.sha }} -t $ECR_REGISTRY/credit-scoring:latest ./scoring-service
          docker push $ECR_REGISTRY/credit-scoring:${{ github.sha }}
          docker push $ECR_REGISTRY/credit-scoring:latest

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/credit-frontend:${{ github.sha }} -t $ECR_REGISTRY/credit-frontend:latest ./frontend
          docker push $ECR_REGISTRY/credit-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/credit-frontend:latest

  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend to ECS
        run: aws ecs update-service --cluster credit-scoring-production --service credit-backend-service --force-new-deployment

      - name: Deploy scoring-service to ECS
        run: aws ecs update-service --cluster credit-scoring-production --service credit-scoring-service --force-new-deployment

      - name: Deploy frontend to ECS
        run: aws ecs update-service --cluster credit-scoring-production --service credit-frontend-service --force-new-deployment
