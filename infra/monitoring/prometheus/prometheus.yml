global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3001']

  - job_name: 'scoring-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['scoring-service:8000']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
