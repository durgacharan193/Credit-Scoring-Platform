apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: credit-scoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: credit-scoring-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres123@postgres:5432/credit_platform?schema=public"
            - name: REDIS_URL
              value: "redis://:redis123@redis:6379"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
            - name: JWT_SECRET
              value: "supersecret-jwt-key-for-k8s"
            - name: SCORING_SERVICE_URL
              value: "http://scoring-service:8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: credit-scoring
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: backend
