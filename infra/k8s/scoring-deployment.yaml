apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-service
  namespace: credit-scoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scoring-service
  template:
    metadata:
      labels:
        app: scoring-service
    spec:
      containers:
        - name: scoring-service
          image: credit-scoring-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres123@postgres:5432/credit_platform"
            - name: REDIS_URL
              value: "redis://:redis123@redis:6379"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scoring-service
  namespace: credit-scoring
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: scoring-service
