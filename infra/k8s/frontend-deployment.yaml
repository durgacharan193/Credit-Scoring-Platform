apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: credit-scoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: credit-scoring-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend:3001"
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: credit-scoring
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: frontend
