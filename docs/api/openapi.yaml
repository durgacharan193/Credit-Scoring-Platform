openapi: 3.0.3
info:
  title: Alternative Credit Scoring Platform API
  version: 1.0.0
  description: RESTful API for cash transaction verification, cryptographic hash chaining, consent lifecycle, and credit report generation.
servers:
  - url: http://localhost:3001
    description: Local Development Server
paths:
  /auth/register:
    post:
      summary: Register a new borrower, lender, or officer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, password, name, role]
              properties:
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                name:
                  type: string
                role:
                  type: string
                  enum: [BORROWER, LENDER, BANK_OFFICER]
      responses:
        '201':
          description: User created
  /auth/login:
    post:
      summary: Authenticate user and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful
  /transactions:
    post:
      summary: Initiate cash transaction and generate OTP
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Transaction initiated
  /transactions/{id}/verify:
    post:
      summary: Verify counterparty transaction using OTP
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction verified and chained
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
